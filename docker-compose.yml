# Local development: Postgres + Redis only. Run the apps with `pnpm dev`.
# Ports are bound to 127.0.0.1 so nothing is exposed to your network.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dualyne
      POSTGRES_PASSWORD: dualyne
      POSTGRES_DB: dualyne
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/dev/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dualyne"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
