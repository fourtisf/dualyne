# Production stack. Used by deploy/scripts/deploy.sh on the server:
#   IMAGE_TAG=<git sha> docker compose -f docker-compose.prod.yml up -d --build
# Postgres and Redis publish no ports. Web and API listen on 127.0.0.1 only; Nginx on the
# host is the only thing exposed to the internet.
name: dualyne

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *logging

  # One-shot: apply database migrations and refresh the model catalog, then exit.
  migrate:
    image: dualyne-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    command: ["sh", "-c", "node_modules/.bin/prisma migrate deploy && node dist/seed.js"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  api:
    image: dualyne-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      API_PORT: "4000"
      TRUST_PROXY: "true"
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    logging: *logging

  web:
    image: dualyne-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_DOMAIN: ${SITE_DOMAIN}
        NEXT_PUBLIC_API_URL: https://api.${SITE_DOMAIN}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
        NEXT_PUBLIC_COMPARE_LIMIT_PER_HOUR: ${COMPARE_LIMIT_PER_HOUR:-10}
        NEXT_PUBLIC_SIWE_CHAIN_ID: ${SIWE_CHAIN_ID:-}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
        NEXT_PUBLIC_DLYN_TOKEN_ADDRESS: ${DLYN_TOKEN_ADDRESS:-}
        NEXT_PUBLIC_PASS_NFT_ADDRESS: ${PASS_NFT_ADDRESS:-}
        NEXT_PUBLIC_DLYN_BUY_URL: ${NEXT_PUBLIC_DLYN_BUY_URL:-}
        NEXT_PUBLIC_DLYN_CHART_URL: ${NEXT_PUBLIC_DLYN_CHART_URL:-}
        NEXT_PUBLIC_EXPLORER_URL: ${NEXT_PUBLIC_EXPLORER_URL:-}
        NEXT_PUBLIC_X_URL: ${NEXT_PUBLIC_X_URL:-}
        NEXT_PUBLIC_TELEGRAM_URL: ${NEXT_PUBLIC_TELEGRAM_URL:-}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  # Nightly pg_dump at 03:00 UTC into BACKUP_DIR on the host, keeping BACKUP_RETENTION_DAYS days.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
    volumes:
      - ./deploy/backup/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-/var/backups/dualyne}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
  redisdata:
